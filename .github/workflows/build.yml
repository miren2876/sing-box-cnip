name: Auto Build sing-box CNIP Rule-Set

on:
  schedule:
    # 北京时间每天早上 6:00 (UTC 22:00) 自动触发构建
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点击按钮触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install sing-box
        run: |
          # 自动获取并安装最新稳定的 sing-box CLI 工具
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Latest sing-box version: ${SING_BOX_VERSION}"
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box /usr/local/bin/
          sing-box version

      - name: Generate JSON Rule-Set
        run: |
          python generate.py

      - name: Compile to 二进制 SRS
        run: |
          # 使用 sing-box 原生命令编译成二进制 .srs 文件
          sing-box rule-set compile cnip.json -o cnip.srs

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 创建 release 编译文件存放目录
          mkdir -p output
          cp cnip.json output/
          cp cnip.srs output/

          git add output/
          if git diff --staged --quiet; then
            echo "没有新增或变动的规则，跳过提交"
          else
            git commit -m "chore: auto update cnip rules [skip ci]"
            git push
          fi
